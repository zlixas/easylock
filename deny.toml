# cargo-deny: dependency licenses, security advisories, and supply-chain hygiene.
# Run with `cargo deny check`.

[graph]
all-features = false

[advisories]
# RustSec advisory database: fail on any known vulnerability or unmaintained crate.
version = 2
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" notices only fail for crates we depend
# on directly; transitive ones (currently via ratatui and tauri: paste, unic-*,
# proc-macro-error) are tracked upstream.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# easylock-core must stay dependency-free; this keeps accidental additions visible.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
