name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Tauri desktop crate needs WebKitGTK on Linux; it is built on macOS.
          - os: ubuntu-latest
            exclude: --exclude easylock-gui
          - os: macos-latest
            exclude: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (pedantic, deny warnings)
        run: cargo clippy --workspace ${{ matrix.exclude }} --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace ${{ matrix.exclude }}
      - name: report hardware crypto paths exercised
        run: cargo test -p easylock-core --release hardware_matches_portable -- --nocapture

  web:
    name: WebAssembly + website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/easylock-web/package-lock.json
      - name: clippy (wasm32)
        run: cargo clippy -p easylock-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: build site
        working-directory: crates/easylock-web
        run: npm ci && npm run wasm && npm run build

  supply-chain:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  fuzz:
    name: Fuzz smoke test (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-fuzz
      - name: run fuzz targets
        working-directory: fuzz
        run: |
          for t in elk_header elk_payload archive decoders aead_roundtrip; do
            # explicit target: the prebuilt cargo-fuzz binary is musl and would default to it
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=60 -max_len=4096
          done

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-llvm-cov
      - name: measure
        run: |
          cargo llvm-cov --workspace --exclude easylock-gui --summary-only | tee coverage.txt
          { echo '### Test coverage'; echo '```'; tail -n 30 coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
