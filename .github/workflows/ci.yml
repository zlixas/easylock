name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Tauri desktop crate needs WebKitGTK on Linux; it is built on macOS.
          - os: ubuntu-latest
            exclude: --exclude easylock-gui
          - os: macos-latest
            exclude: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (pedantic, deny warnings)
        run: cargo clippy --workspace ${{ matrix.exclude }} --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace ${{ matrix.exclude }}

  web:
    name: WebAssembly + website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/easylock-web/package-lock.json
      - name: clippy (wasm32)
        run: cargo clippy -p easylock-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: build site
        working-directory: crates/easylock-web
        run: npm ci && npm run wasm && npm run build
