name: ✨ Feature request
description: Suggest a primitive, tool, translation or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful (for learning, interoperability, …)?
  - type: input
    id: spec
    attributes:
      label: Relevant specification (RFC / FIPS / paper), if any
