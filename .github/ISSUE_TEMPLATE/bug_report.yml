name: 🐞 Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues must not be filed here.** Please use
        [private vulnerability reporting](https://github.com/zlixas/easylock/security/advisories/new) instead.
  - type: dropdown
    id: frontend
    attributes:
      label: Where did it happen?
      options: [CLI, TUI, Website, Desktop app, Server, Library (easylock-core), Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `easylock ...`
        2. ...
  - type: input
    id: version
    attributes:
      label: Version / commit and platform
      placeholder: "output of `easylock info`, browser + OS, …"
