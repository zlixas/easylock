[workspace]
resolver = "2"
members = [
    "crates/easylock-core",
    "crates/easylock-cli",
    "crates/easylock-server",
    "crates/easylock-gui",
    "crates/easylock-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0 OR MIT"
authors = ["easylock contributors"]
repository = "https://github.com/easylock/easylock"
description = "A from-scratch cryptography library, CLI, and engine written in Rust"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Cryptographic code deliberately uses wrapping/bit twiddling, long constant
# tables, single-letter state variables (a..h, r0/r1), and index-based limb loops.
unreadable_literal = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
many_single_char_names = "allow"
inline_always = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
needless_range_loop = "allow"
struct_excessive_bools = "allow"
chunks_exact_to_as_chunks = "allow"
manual_is_multiple_of = "allow"
decimal_bitwise_operands = "allow"
ref_option = "allow"

[workspace.dependencies]
easylock-core = { path = "crates/easylock-core", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# `panic = "unwind"` (the default) is kept so the FFI layer's `catch_unwind`
# guard can turn a panic into an error code instead of aborting the host process.
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
