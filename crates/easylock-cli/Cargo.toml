[package]
name = "easylock-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line interface and terminal UI for easylock, in English, Turkish and Spanish"

[[bin]]
name = "easylock"
path = "src/main.rs"

[dependencies]
easylock-core = { workspace = true }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
ratatui = "0.30"
getrandom = "0.2"

[lints]
workspace = true
